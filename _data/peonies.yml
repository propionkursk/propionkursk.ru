# =============================================================================
# _data/peonies.yml
# Обновлено 01.09.2026 по мастер-анкете фактчека
# (Propionkursk_Peony_Master_VERIFIED_v5_FAQ_SIMILAR.xlsx), лист "Анкета
# сортов" — 15 из 16 записей прошли фактчек по реестру American Peony
# Society (для Jadwiga — польский источник Bilscy, для Red Magic —
# RHS/Green Works с явной пометкой о неопределённом происхождении).
#
# ВАЖНО — статус этого файла:
# 1. У каждой записи (кроме white_peony) есть комментарий с источником
#    справочных данных и статусом проверки, плюс список полей, которые
#    сама анкета отмечает как требующие дополнительного подтверждения
#    (см. лист "Открытые вопросы" исходной анкеты). Наличие значения не
#    означает "подтверждено окончательно" — сверяйтесь с комментарием.
# 2. experience — теперь объект (general/fragrance/winter_hardiness/
#    cut_flower), везде null у всех 16 сортов. Анкета даёт для этих полей
#    только типовую фразу-заглушку, реальных наблюдений питомника ещё нет.
#    Не переносим шаблонный текст как факт.
# 3. flower.color_change — новое поле ("изменение окраски при роспуске"),
#    заполнено там, где в анкете была конкретная последовательность
#    (9 из 16 сортов), иначе null.
# 4. Два разных текста-заглушки для null в шаблоне (не хранятся в этом
#    файле, задаются на уровне вёрстки):
#    - справочные поля без подтверждённых данных → "Пока нет подтверждённых
#      данных";
#    - поля опыта питомника (experience.*) → "Наблюдения питомника
#      собираются" (experience.general — расширенная версия текста).
# 5. sale.division и images — анкета не дала новых данных по коммерции
#    и фотопакету (все связанные колонки пустые). Значения перенесены
#    без изменений из предыдущей версии файла, включая пометки TODO.
#    Пустой слот фотогалереи не выводится вовсе — ни рамкой-заглушкой,
#    ни текстом "фото отсутствует", ни чужим/стоковым изображением.
# 6. renato/vogue/hillary/jadwiga — цвет и описание оттенка скорректированы
#    вручную по итогам ревью (01.09.2026): у Ренато анкета давала
#    противоречие (color: red, но текст — "нежно-розовый"), уточнено
#    напрямую; у Vogue/Jadwiga цвет переведён из null/multicolor в pink;
#    у Hillary уточнена формулировка color_description.
# 7. white_peony — не тронут по содержанию (в анкете статус "Не
#    идентифицирован", фактчек не проводился), но структура experience/
#    color_change приведена к единому виду с остальными 15 записями.
# =============================================================================

- id: renato
  name_ru: "Ренато"
  name_original: "Renato"
  slug: "renato"
  group: "herbaceous"

  # Фактчек по анкете propionkursk (источник: https://americanpeonysociety.org/cultivars/peony-registry/renato/; статус: APS проверено)
  # Анкета отмечает как требующее дополнительной проверки: диаметр, аромат, высота, стебли/опора
  origin:
    breeder: "Murawska"
    country: "США"
    year: 1949

  flower:
    color: "red"
    color_description: "Насыщенный малиново-красный / кримсоновый"
