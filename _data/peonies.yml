  content:
    short_description: >
      Махровый пион с крупными насыщенно-малиново-красными цветками и плотным
      полным центром. Яркий классический сорт среднего срока цветения.
    description: >
      Ренато — травянистый махровый пион с крупными насыщенно-красными цветками
      с выраженным малиновым оттенком. Крупные наружные лепестки окружают
      плотный, хорошо наполненный центр, благодаря чему цветок выглядит
      объёмным и собранным.

      В официальной регистрации сорт описан как более крупный и наполненный по
      сравнению с пионовидным сортом Felix Crousse. Ренато цветёт в средние
      сроки и ценится за выразительную окраску и пригодность для срезки.
    advantages:
      - "Насыщенная малиново-красная окраска"
      - "Крупные махровые цветки"
      - "Плотный полный центр"
      - "Подходит для срезки"
    care: "Специальных требований к уходу, отличающих сорт от большинства травянистых пионов, не выявлено. Используйте общие рекомендации по выращиванию пионов."

  experience:
