      status: in_stock
      price_rub: null
      season_note: "Продажа делёнок проводится осенью (сентябрь–октябрь)"

  similar: [red_magic, kansas, red_charm]
  faq:
    - question: "Какого цвета пион Ренато?"
      answer: "Цветки Ренато насыщенно-красные, с выраженным малиновым или кримсоновым оттенком."
    - question: "Какого размера цветки у пиона Ренато?"
      answer: "В мастер-таблице для сорта указан ориентировочный диаметр около 15 см. Фактический размер зависит от возраста куста и условий выращивания."
    - question: "Когда цветёт пион Ренато?"
      answer: "Ренато относится к сортам среднего срока цветения. В Курской области конкретные даты меняются в зависимости от погоды сезона."
    - question: "Нужна ли пиону Ренато опора?"
      answer: "Однозначное правило для этого сорта пока не фиксируем. Необходимость поддержки лучше оценивать по взрослому кусту, нагрузке цветками и погоде."
    - question: "Есть ли у пиона Ренато аромат?"
      answer: "В справочных данных аромат характеризуется как умеренный. Восприятие его силы может различаться в зависимости от погоды и стадии раскрытия цветка."
    - question: "Чем интересен пион Ренато?"
      answer: "Это классический махровый сорт с насыщенной малиново-красной окраской и плотным полным центром. Он ценится за яркий, выразительный цвет и хорошую пригодность для срезки."
  seo:
    title: null
    description: "Пион Ренато (Renato): крупные махровые цветки насыщенного малиново-красного оттенка. Описание сорта, характеристики, фотографии и выращивание."


