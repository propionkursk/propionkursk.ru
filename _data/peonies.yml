    - question: "Нужна ли Бартзелле опора?"
      answer: "Обычно нет. Как ИТО-гибрид Бартзелла формирует крепкий устойчивый куст, хорошо сохраняющий форму."
    - question: "Есть ли у Бартзеллы аромат?"
      answer: "В справочных данных аромат отмечен как лёгкий. Его выраженность может меняться в зависимости от погоды и стадии раскрытия цветка."
    - question: "Как Бартзелла ведёт себя после дождя и на солнце?"
      answer: "Куст и цветки в целом хорошо переносят дождь. На солнце жёлтая окраска постепенно становится светлее."
