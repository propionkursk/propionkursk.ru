      красноватыми мазками у основания лепестков. Формирует красивый устойчивый куст
      и отличается продолжительным декоративным цветением.
    description: >
      Бартзелла — один из самых узнаваемых ИТО-пионов. Его крупные полумахровые и
      махровые цветки окрашены в яркий жёлтый цвет, а у основания лепестков заметны
      контрастные красноватые мазки. На фоне зелёной листвы такая окраска выглядит
      особенно выразительно. Как и другие ИТО-гибриды, Бартзелла формирует широкий
      устойчивый куст с крепкими побегами. Цветки появляются не одновременно,
      поэтому декоративный период растягивается, а на одном взрослом растении можно
      одновременно увидеть бутоны и цветки разных стадий раскрытия.
    advantages:
      - "Яркая жёлтая окраска"
      - "Контрастные красноватые мазки у основания лепестков"
      - "Крепкий устойчивый куст"
      - "Продолжительный декоративный период благодаря постепенному раскрытию цветков"
    care: "Как ИТО-гибрид формирует крепкий устойчивый куст и обычно не требует опоры. Осенью побеги обрезают после завершения сезона, как и у других травянистых и ИТО-пионов."

