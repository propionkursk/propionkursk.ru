#
# ВАЖНО — статус этого файла:
# 1. Все структурированные поля (color, form, height_cm, diameter_cm,
#    fragrance, stem_strength, flowering.period) заполнены ТОЛЬКО там,
#    где явно указано в исходном тексте сайта. Где явных данных нет —
#    оставлено null. Ничего не придумано.
# 2. origin (селекционер/страна/год) почти везде null — на сайте эти
#    данные не публиковались. Это отдельная задача фактчека (см. 17.8
#    мастер-документа), НЕ решается автоматическим переносом текста.
# 3. sale.division — на сайте нет статусов по сортам вообще (только общий
#    контакт). Проставлен рабочий дефолт status: "out_of_season" с
#    season_note по правилу раздела 3.11 мастер-документа (делёнки продают
#    осенью). Это ПРЕДПОЛОЖЕНИЕ для старта, а не подтверждённый факт —
#    отмечено TODO у каждой записи, нужно свериться с реальным наличием.
# 4. images.cover временно указывает на ТЕКУЩИЙ файл с сайта (не 1:1,
#    не webp) — стандарт STYLE-001 требует конвертации в 1:1 webp и
#    переноса в /img/peonies/{slug}/. Отмечено TODO.
# 5. similar, faq, experience, content.advantages местами пустые —
#    заполняются вручную позже, не автогенерируются (правило проекта:
#    не выдумывать данные).
# 6. name_original — дано только там, где очевидно совпадает с
#    оригинальным (латинским) названием сорта. Требует финального
#    фактчека наравне с origin (раздел 17.8).
# =============================================================================

