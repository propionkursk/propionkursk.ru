# Человекочитаемые подписи для enum-значений PM-007 (MASTER-PEONY-001, разделы 3.2, 3.5, 3.7).
# Используются в badges (7.1) и характеристиках (8). Не источник данных о сорте — только перевод значений.

group:
  herbaceous: "Травянистый"
  ito: "ИТО-гибрид"
  tree: "Древовидный"

# Заголовки групп для каталога (плитки, H1 /catalog/{group}/) — форма множественного числа
group_title:
  herbaceous: "Травянистые пионы"
  ito: "ИТО-пионы"
  tree: "Древовидные пионы"

flower_form:
  single: "Немахровый"
  semi_double: "Полумахровый"
  double: "Махровый"
  japanese: "Японский"
  anemone: "Анемоновидный"
  bomb: "Бомбовидный"

flower_color:
  white: "Белый"
  cream: "Кремовый"
  yellow: "Жёлтый"
  coral: "Коралловый"
  salmon: "Лососевый"
  pink: "Розовый"
  red: "Красный"
  burgundy: "Бордовый"
  purple: "Пурпурный"
  multicolor: "Многоцветный"

fragrance:
  none: "Без аромата"
  light: "Лёгкий аромат"
  moderate: "Умеренный аромат"
  strong: "Сильный аромат"

flowering_period:
  early: "Ранний срок цветения"
  mid: "Средний срок цветения"
  late: "Поздний срок цветения"

# Раздел 8: "использование" выводится из plant.cut_flower_suitable
cut_flower_suitable:
  "true": "Сад, срезка"
  "false": "Сад"

# Раздел 10: короткая статусная строка в commerce-карточке (sale.division.status)
sale_status:
  in_stock: "в наличии"
  preorder: "доступен предзаказ"
  out_of_season: "сезон продаж ещё не наступил"
  unavailable: "недоступен"

# Раздел 2.6 STYLE-001: желательные типы кадров галереи (обновлено PM-007 v1.3,
# 01.09.2026 — добавлены field/bouquet/cut_flower по факту первого фотопакета).
# images.gallery[].type — только для подписи по умолчанию (fallback для caption),
# сама галерея выводит все фото из массива в заданном в данных порядке; кадра
# нет — просто нет фото в массиве, слот не рисуется вообще (без плейсхолдера).
gallery_shot_types:
  - key: bud
    label: "Бутон"
  - key: opening
    label: "Начало раскрытия"
  - key: full_bloom
    label: "Полный роспуск"
  - key: late_bloom
    label: "Поздняя стадия цветения"
  - key: closeup
    label: "Крупный план"
  - key: bush
    label: "Куст"
  - key: foliage
    label: "Листва"
  - key: division
    label: "Делёнка"
  - key: field
    label: "В поле"
  - key: bouquet
    label: "Букет"
  - key: cut_flower
    label: "Срезка"
