{% assign v = include.variety %}
{% assign faq = v.faq %}
{% if faq and faq.size > 0 %}
  <section class="faq" aria-label="Частые вопросы о сорте {{ v.name_ru }}">
    <h2>Частые вопросы</h2>
    {% for item in faq %}
      <details class="faq__item">
        <summary>{{ item.question }}</summary>
        <p>{{ item.answer }}</p>
      </details>
    {% endfor %}
  </section>
{% endif %}
